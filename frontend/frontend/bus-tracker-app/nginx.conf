server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend.bus-tracker.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend WebSocket proxy
    location /ws/ {
        proxy_pass http://backend.bus-tracker.local:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # GenAI proxy
    location /genai/ {
        proxy_pass http://genai.bus-tracker.local:8000/;
        proxy_set_header Host $host;
    }

    # Fallback to index.html for Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
