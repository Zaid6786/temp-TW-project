<div class="page-header" style="margin-bottom: 25px;">
  <h1 style="color: var(--color-primary); font-size: 1.8rem; margin-bottom: 5px;">Submit a Complaint</h1>
  <p style="color: var(--text-muted);">Report an issue with a bus, driver, or route.</p>
</div>

<div class="glass-panel" style="padding: 30px; max-width: 700px;">
  
  <div *ngIf="message" style="padding: 15px; margin-bottom: 20px; border-radius: var(--radius-md); background: rgba(16, 185, 129, 0.1); color: var(--color-accent); border: 1px solid var(--color-accent);">
    {{ message }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main);">Issue Subject</label>
      <input type="text" class="input-field" [(ngModel)]="title" name="title" placeholder="Brief description of the issue" required>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main);">Related Route / Bus (Optional)</label>
      <select class="input-field" [(ngModel)]="selectedRoute" name="selectedRoute">
        <option value="">Select a Route</option>
        <option value="Route A">Route A</option>
        <option value="Route B">Route B</option>
      </select>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main);">Details</label>
      <textarea class="input-field" rows="5" [(ngModel)]="description" name="description" placeholder="Please provide more details..." required></textarea>
    </div>

    <button type="submit" class="btn-primary" style="background: var(--color-accent); width: 100%;">Submit Complaint</button>
  </form>
</div>
