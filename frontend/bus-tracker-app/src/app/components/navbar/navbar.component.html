<nav class="navbar glass-navbar">
  <div class="navbar-brand" routerLink="/">
    <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-1.1 0-2 .9-2 2v7h2"/>
      <circle cx="7" cy="17" r="2"/>
      <path d="M9 17h6"/>
      <circle cx="17" cy="17" r="2"/>
    </svg>
    <span class="brand-text">Bus<span class="highlight">Tracker</span> <span class="brand-badge">PRO</span></span>
  </div>

  <div class="navbar-menu">
    <div class="user-badge" *ngIf="currentUser">
      <div class="avatar">
        {{ (currentUser.username || currentUser.studentId)?.substring(0, 2).toUpperCase() }}
      </div>
      <div class="user-details">
        <span class="user-name">{{ currentUser.username || currentUser.studentId }}</span>
        <span class="user-role">{{ currentUser.role === 'ADMIN' ? 'Administrator' : 'Student Portal' }}</span>
      </div>
    </div>
    
    <div class="nav-actions">
      <ng-container *ngIf="currentUser; else guestActions">
        <button class="nav-btn btn-logout" (click)="logout()">
          <span>Logout</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </ng-container>
      <ng-template #guestActions>
        <span class="secure-badge">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Secure Portal
        </span>
      </ng-template>
    </div>
  </div>
</nav>
