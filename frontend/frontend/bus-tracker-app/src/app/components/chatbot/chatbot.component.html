<div class="chatbot-container" [class.open]="isOpen">
  <!-- Chat Window -->
  <div class="chat-window">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar">
          <span class="bot-icon">🤖</span>
        </div>
        <div class="title">
          <h3>College Bus AI</h3>
          <span class="status">Online</span>
        </div>
      </div>
      <button class="close-btn" (click)="toggleChat()">×</button>
    </div>
    
    <div class="chat-messages" #chatScroll>
      <div class="message" *ngFor="let msg of messages" [class.user]="msg.isUser" [class.bot]="!msg.isUser">
        <div class="msg-bubble">
          {{ msg.text }}
        </div>
      </div>
      <div class="message bot typing" *ngIf="isTyping">
        <div class="msg-bubble">
          <div class="dot-typing"></div>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" 
             [(ngModel)]="newMessage" 
             (keyup.enter)="sendMessage()"
             placeholder="Ask about your bus, delays, or fees..." />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim() || isTyping">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button class="fab" (click)="toggleChat()" [class.hidden]="isOpen">
    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
  </button>
</div>
