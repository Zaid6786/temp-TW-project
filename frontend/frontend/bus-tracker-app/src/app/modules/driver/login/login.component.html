<div class="login-container">
  <div class="login-card">
    <div class="header">
      <h2>Driver Portal</h2>
      <p>Sign in to manage your route and location.</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Driver Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="username" 
          required 
          placeholder="e.g. driver01"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Enter password"
          class="form-control"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid">
        Login to Dashboard
      </button>
    </form>
    
    <div class="footer-links">
      <a routerLink="/student/login">Back to Student Login</a>
    </div>
  </div>
</div>
