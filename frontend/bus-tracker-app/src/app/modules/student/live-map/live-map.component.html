<div class="map-wrapper" style="height: 100%; display: flex; flex-direction: column;">
  <div class="map-header" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h1 style="color: var(--color-accent); font-size: 1.8rem; margin-bottom: 5px;">Live Bus Tracker</h1>
      <p style="color: var(--text-muted);">Track your bus in real-time.</p>
    </div>
    <div class="map-controls">
      <select class="input-field" style="width: 200px;">
        <option>Route A</option>
        <option>Route B</option>
      </select>
    </div>
  </div>

  <div class="glass-panel map-container" style="flex: 1; min-height: 500px; position: relative; background: #e2e8f0; border-radius: var(--radius-lg); overflow: hidden; display: flex; align-items: center; justify-content: center;">
    <!-- Mock Map Background -->
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(#cbd5e1 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <!-- Mock Bus Marker -->
    <div class="bus-marker" style="position: absolute; top: 40%; left: 30%; background: var(--color-accent); color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; box-shadow: var(--shadow-md); z-index: 2;">
      Bus #4 (Route A)
    </div>
    
    <!-- Student Marker -->
    <div class="student-marker" style="position: absolute; top: 45%; left: 35%; background: var(--color-primary); color: white; width: 15px; height: 15px; border-radius: 50%; border: 2px solid white; box-shadow: var(--shadow-sm); z-index: 1;"></div>

    <h2 style="position: relative; z-index: 10; color: var(--text-muted); background: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: var(--radius-md);">Interactive Map Integration Goes Here</h2>
  </div>
</div>
