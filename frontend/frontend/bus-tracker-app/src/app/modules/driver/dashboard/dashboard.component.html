<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="logo">
      <i class="fas fa-bus-alt"></i> Driver Dashboard
    </div>
    <div class="user-info">
      <span>Welcome, {{ driverName }}</span>
      <button class="btn btn-logout" (click)="logout()">Logout</button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="card tracking-card" [class.is-tracking]="isTracking">
      <h2>Location Sharing</h2>
      <p class="status-text">
        Status: <span class="badge" [class.active]="isTracking">{{ trackingStatus }}</span>
      </p>

      <div class="bus-selector" *ngIf="!isTracking">
        <label for="busSelect">Select your assigned bus:</label>
        <select id="busSelect" [(ngModel)]="selectedBusId" class="form-control">
          <option [ngValue]="null" disabled>Select Bus</option>
          <option *ngFor="let bus of buses" [ngValue]="bus.busId">
            Bus #{{ bus.busId }} - {{ bus.routeCode }}
          </option>
        </select>
      </div>

      <div class="coordinates" *ngIf="lastPosition">
        <p><strong>Current Lat:</strong> {{ lastPosition.lat | number:'1.4-4' }}</p>
        <p><strong>Current Lng:</strong> {{ lastPosition.lng | number:'1.4-4' }}</p>
      </div>

      <button class="btn btn-massive" (click)="toggleTracking()" [class.btn-stop]="isTracking">
        <i class="fas" [class.fa-play]="!isTracking" [class.fa-stop]="isTracking"></i>
        {{ isTracking ? 'Stop Sharing Location' : 'Start Location Sharing' }}
      </button>
      
      <p class="helper-text" *ngIf="!isTracking">
        Make sure you allow location permissions in your browser.
      </p>
    </div>
  </main>
</div>
