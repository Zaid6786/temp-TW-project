spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:3306/bus_tracker_db?useSSL=false
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:your-s3-bucket-name}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
  
  security:
    jwt:
      secret: this-is-a-very-long-and-secure-256-bit-secret-key-for-jwt-generation-which-must-be-very-long
      expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.college.bus: DEBUG
    org.springframework.security: DEBUG
